CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SLEEP=n

# per ZMK dongle docs: BT_MAX_CONN/BT_MAX_PAIRED should cover the peripherals
# plus the default 5 host bluetooth profiles
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# dongle_display: keep battery/layer/modifiers (module defaults), drop Bongo Cat
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

# bigger font for the layer number widget
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="right"

# blank the OLED after 5 minutes idle (dongle stays awake otherwise, USB-powered)
CONFIG_ZMK_IDLE_TIMEOUT=300000
