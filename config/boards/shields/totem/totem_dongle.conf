CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SLEEP=n

# Needed for the MOUSE layer's &mmv/&mkp/&msc bindings (keyboard-emulated cursor
# movement + clicks, no physical pointer device required). Behaviors only run on
# the central (this board), so peripherals don't need this. Lives here and not in
# the generic totem.conf because that file is never actually read by the build --
# see the 2026-08-01 NOTES.md entry.
CONFIG_ZMK_POINTING=y

# per ZMK dongle docs: BT_MAX_CONN/BT_MAX_PAIRED should cover the peripherals
# plus the default 5 host bluetooth profiles
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# dongle_display: keep battery/layer/modifiers (module defaults), drop Bongo Cat
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

# bigger font for the layer number widget
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="right"

# blank the OLED after 25 minutes idle (dongle stays awake otherwise, USB-powered)
CONFIG_ZMK_IDLE_TIMEOUT=1500000
